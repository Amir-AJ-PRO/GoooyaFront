services:
  gooya-nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NPM_AUDIT_FIX: "true"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SUPPORT_API_BASE_URL: ${NEXT_PUBLIC_SUPPORT_API_BASE_URL:-}
        API_BASE: ${API_BASE:-}
    image: gooya-nextjs:latest
    container_name: gooya-nextjs
    ports:
      - "8030:8030"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=8030
      - HOSTNAME=0.0.0.0
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks:
      - gooya-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8030/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  gooya-network:
    driver: bridge
